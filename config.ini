; ตั้งค่าการเชื่อมต่อระบบสมาชิก ร้านยามุมยาเภสัช
; SQL Server ที่ CW Pharma ใช้อยู่
SqlServer=.\SQLEXPRESS
; ชื่อฐานข้อมูลของ CW Pharma (อ่านอย่างเดียว ไม่มีการแก้ไข)
CwDatabase=Pmc
; ฐานข้อมูลของระบบสมาชิก (สร้างให้อัตโนมัติครั้งแรก)
MemberDatabase=YaMumMember
; ที่อยู่หน้าเว็บ — ถ้าต้องการให้เครื่องอื่นในร้านเข้าได้ เปลี่ยนเป็น http://+:8088/ (ต้องตั้ง urlacl ด้วยสิทธิ์ admin)
Listen=http://localhost:8088/
; ที่อยู่ไฟล์ update.json สำหรับอัปเดตอัตโนมัติ — ค่าเริ่มต้นฝังไว้ใน exe แล้ว (GitHub Porjai362/yamum-member)
; ใส่เฉพาะถ้าต้องการเปลี่ยนที่ดึงอัปเดต เช่น
;   UpdateUrl=\\PC-เภสัช\YaMumUpdate\update.json
